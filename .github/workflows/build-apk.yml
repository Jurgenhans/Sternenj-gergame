
name: Sternenjaeger APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper erstellen
        working-directory: entpackt/DateiAgent
        run: gradle wrapper

      - name: APK erstellen
        working-directory: entpackt/DateiAgent
        run: ./gradlew assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Sternenjaeger-APK
          path: entpackt/DateiAgent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
