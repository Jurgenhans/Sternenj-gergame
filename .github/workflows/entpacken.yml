
name: ZIP automatisch entpacken

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          mkdir -p entpackt
          for file in *.zip; do
            [ -f "$file" ] || continue
            unzip -o "$file" -d entpackt/
          done

      - name: Dateien speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entpackt/
          git commit -m "ZIP automatisch entpackt" || echo "Keine Änderungen"
          git push
